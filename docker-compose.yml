services:

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./app/laravel:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./app/laravel:/var/www/html

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: cms_app
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: cms_user
      MYSQL_PASSWORD: password